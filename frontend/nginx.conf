# nginx config for the frontend container.
# - Serves the built React app (a single-page app).
# - Forwards every /api/ request to the FastAPI backend container ("backend" is
#   the service name in docker-compose.yml), keeping the /api prefix.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Slightly above the backend's 10 MB limit, so the backend's own
    # "File too large" message is the one the user sees.
    client_max_body_size 12m;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Any other path: serve the file if it exists, otherwise index.html (SPA fallback).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
